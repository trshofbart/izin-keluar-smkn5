# Izin Keluar SMKN 5 — diakses lewat localhost + port saja (tanpa path).
#
# CARA PASANG (di laptop Laragon):
# 1. Simpan file ini sebagai:
#    C:\laragon\etc\apache2\sites-enabled\00-izin-keluar-smkn5.conf
#    (nama diawali 00- supaya dibaca pertama dan menjadi default untuk
#    request yang datang lewat localhost/IP, tanpa nama domain)
# 2. Restart Apache di Laragon (Stop lalu Start).
# 3. Buka http://localhost:8001/ — aplikasi langsung tampil.
#    Admin: http://localhost:8001/admin
#
# Catatan:
# - Port 8001 dipilih supaya tidak bentrok dengan Buku Induk yang memakai
#   port 8000 (satu port per aplikasi).
# - Setelah ini, localhost:8001 HANYA melayani aplikasi ini. Proyek lain
#   di Laragon tetap bisa dibuka lewat domain .test-nya masing-masing,
#   dan aplikasi ini tetap bisa dibuka lewat http://izin-keluar-smkn5.test
# - Kalau folder proyekmu bukan di C:\laragon\www\izin-keluar-smkn5,
#   sesuaikan dua path DocumentRoot/Directory di bawah.
# - Jangan lupa di .env: APP_URL=http://localhost:8001 lalu
#   jalankan `php artisan config:clear`.
# - Untuk akses dari HP/laptop lain di jaringan yang sama, ganti localhost
#   dengan IP LAN laptop (mis. http://192.168.1.10:8001) di APP_URL dan
#   di browser. Untuk akses dari internet, pakai IP publik + port
#   forwarding di router, sama seperti Buku Induk.

<VirtualHost *:8001>
    ServerName localhost
    DocumentRoot "C:/laragon/www/izin-keluar-smkn5/public"

    <Directory "C:/laragon/www/izin-keluar-smkn5/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/izin-keluar-smkn5-error.log"
    CustomLog "logs/izin-keluar-smkn5-access.log" common
</VirtualHost>
