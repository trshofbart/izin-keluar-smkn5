# Izin Keluar SMKN 5 — diakses lewat subdirektori localhost:
# http://localhost/izin-keluar-smkn5/ (tanpa /public di belakang).
#
# CARA PASANG (di laptop Laragon):
# 1. Salin file ini menjadi:
#    C:\laragon\etc\apache2\sites-enabled\00-izin-keluar-smkn5-alias.conf
# 2. Restart Apache di Laragon (Stop lalu Start).
# 3. Di .env: APP_URL=http://localhost/izin-keluar-smkn5 lalu
#    jalankan `php artisan config:clear`.
# 4. Buka http://localhost/izin-keluar-smkn5/
#    Admin: http://localhost/izin-keluar-smkn5/admin
#
# Kenapa pakai Alias (bukan .htaccess di root proyek)?
# Laravel TIDAK bisa dilayani dari subdirektori docroot hanya dengan
# .htaccess yang meneruskan request ke public/ — routing-nya 404 karena
# Laravel membaca path dari REQUEST_URI, dan prefix subdirektori tidak
# bisa dihilangkan oleh rewrite. Sudah diuji langsung dengan Apache:
# .htaccess root hanya membuat file statis jalan, semua route 404.
# Alias memetakan /izin-keluar-smkn5 langsung ke folder public/ proyek,
# sehingga DocumentRoot untuk alamat ini benar-benar public/ — dan semua
# route, aset, Livewire, dan login jalan normal (terverifikasi).
#
# Catatan:
# - Blok rewrite di bawah WAJIB ada di sini (server context), bukan di
#   public/.htaccess — rewrite relatif di .htaccess + Alias menyebabkan
#   redirect loop (HTTP 500). Karena itu Directory di bawah memakai
#   AllowOverride None dan aturan rewrite-nya ditulis di sini.
# - Kalau folder proyekmu bukan di C:\laragon\www\izin-keluar-smkn5,
#   sesuaikan dua path di bawah.

Alias /izin-keluar-smkn5 "C:/laragon/www/izin-keluar-smkn5/public"

<Directory "C:/laragon/www/izin-keluar-smkn5/public">
    AllowOverride None
    Require all granted

    RewriteEngine On

    # Teruskan header Authorization (dipakai beberapa fitur auth).
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    # Kirim semua request yang bukan file/folder ke front controller.
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ /izin-keluar-smkn5/index.php [L]
</Directory>
